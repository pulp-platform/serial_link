name: lint

on: [push, pull_request]

jobs:

  ###############
  # Check Clean #
  ###############
  check-clean:
    runs-on: ubuntu-latest
    env:
      PEAKRDL: uv run peakrdl
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Check clean targets
        run: |
          just gen-regs
          just clean
          git status && test -z "$(git status --porcelain)"

  ###############
  # Check Stale #
  ###############
  check-stale:
    runs-on: ubuntu-latest
    env:
      PEAKRDL: uv run peakrdl
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Check stale targets
        run: |
          just gen-regs
          git status && test -z "$(git status --porcelain)"

  #####################
  # Bender up-to-date #
  #####################
  bender-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - name: Check Bender up-to-date
        uses: pulp-platform/pulp-actions/bender-up-to-date@v2.5.1

  ################
  # Verible Lint #
  ################
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: chipsalliance/verible-linter-action@main
      with:
        paths: |
          ./src
        exclude_paths: |
          ./src/regs
        extra_args: "--waiver_files util/verible.waiver"
        github_token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_error: true
        reviewdog_reporter: github-check

  #########
  # REUSE #
  #########
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  #########
  # Slang #
  #########
  slang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1

      - name: Generate bender file list
        run: bender script flist-plus -t simulation -t slink_test > slink.f

      - name: Slang lint
        uses: pulp-platform/pulp-actions/slang@v2.5.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          slang-flags: >-
            -f slink.f --top tb_axi_slink
            -Wno-finish-num
            --suppress-warnings .bender
